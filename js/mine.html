<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #111; color: white; font-family: Poppins, sans-serif; }
    .chatbox { max-height: 70vh; overflow-y: auto; padding: 10px; }
    .chat-message { padding: 10px; border-radius: 10px; margin-bottom: 8px; }
    .user-message { background: #007bff; align-self: flex-end; text-align: right; }
    .assistant-message { background: #222; }
    #chatInput { width: 80%; border-radius: 10px; border: none; padding: 10px; }
    #sendButton { border-radius: 10px; padding: 10px 15px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">🤖 Gemini Chatbot</h2>
    <div id="chatbox" class="chatbox border rounded p-3 bg-dark d-flex flex-column"></div>
    <div class="d-flex mt-3">
      <input id="chatInput" class="form-control me-2" placeholder="Type a message..." />
      <button id="sendButton" class="btn btn-primary">Send</button>
    </div>
  </div>

  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // 🔑 Replace with your actual API key
    const API_KEY = "AIzaSyDVmhRlndY2vqayPY8GCCluDsEltpqtiQ0";

    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

    const sendButton = document.getElementById("sendButton");
    const chatInput = document.getElementById("chatInput");
    const chatbox = document.getElementById("chatbox");

    // Function to display messages
    function displayMessage(message, isUser) {
      const msgElem = document.createElement("div");
      msgElem.className = `chat-message ${isUser ? "user-message" : "assistant-message"}`;
      msgElem.textContent = message;
      chatbox.appendChild(msgElem);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    // Handle message send
    async function sendMessage() {
      const prompt = chatInput.value.trim();
      if (!prompt) return;

      displayMessage(prompt, true);
      chatInput.value = "";

      try {
        const result = await model.generateContent(prompt);
        const text = result.response.text();
        displayMessage(text, false);
      } catch (err) {
        console.error("Error:", err);
        displayMessage("⚠️ Error connecting to Gemini API.", false);
      }
    }

    sendButton.addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
