<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sab Poch Lo</title>
    
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&family=Pacifico&display=swap" rel="stylesheet">

   
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/Style.css">

 

</head>

<body>
<nav class="navbar d-flex justify-content-between align-items-center px-3 py-2 bg-light shadow-sm">
    <button id="dashboardToggle" class="btn btn-outline-dark">
        <span class="material-icons">menu</span>
    </button>
    <span class="navbar-brand mb-0 h1">Sab Poch Lo</span>
</nav>


<div id="dashboard" class="dashboard">
    <div class="dashboard-header d-flex justify-content-between align-items-center p-3 border-bottom">
        <h5 class="mb-0">Dashboard</h5>
        <button id="dashboardClose" class="btn btn-sm btn-outline-secondary">
            <span class="material-icons">close</span>
        </button>
    </div>
    <div class="dashboard-content p-3">
      
          <button id="signOutBtn" class="btn btn-danger w-100">
        <span class="material-icons align-middle">logout</span> Sign Out
    </button>
    
    
    </div>
</div>


    
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="chatbox-container rounded-3 shadow-lg p-4 bg-white w-100">
            <div class="chat-title text-center mb-4">
                <h2>Sab Poch Lo</h2>
            </div>

            <div id="chatbox" class="chatbox mb-3 p-2" style="max-height: 400px; overflow-y: auto;"></div>

            <div class="input-area d-flex align-items-center gap-2 flex-wrap">
    <div class="d-flex align-items-center gap-2">
        <button id="micButton" class="input-button btn btn-light rounded-circle p-2">
            <span class="material-icons">mic</span>
        </button>

        <button id="imageButton" class="input-button btn btn-light rounded-circle p-2">
            <span class="material-icons">image</span>
        </button>

        <button id="scannerButton" class="input-button btn btn-light rounded-circle p-2">
            <span class="material-icons">camera_alt</span>
        </button>
    </div>

    <input id="chatInput" type="text" class="form-control rounded-pill flex-grow-1" placeholder="Type your message" />

    <button id="sendButton" class="input-button btn btn-light rounded-circle p-2">
        <span class="material-icons">send</span>
    </button>
</div>

  
   
    
<script src="./js/style.js"></script>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
